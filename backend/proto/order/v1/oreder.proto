syntax = "proto3";

package order.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/InakiGT/order-processor-system/backend/proto/order/v1;order";

service OrderService {
    rpc ListOrders(ListOrdersRequest)
        returns (ListOrdersResponse);

    rpc GetOrder(GetOrderRequest)
        returns (GetOrderResponse);

    rpc CreateOrder(CreateOrderRequest)
        returns (CreateOrderResponse);

    rpc DeleteOrder(DeleteOrderRequest)
        returns (google.protobuf.Empty);

    rpc ChangeOrderStatus(ChangeOrderStatusRequest)
        returns (google.protobuf.Empty);
}

// Requests
message ListOrdersRequest {}

message GetOrderRequest {
    int32 id = 1;
}

message CreateOrderRequest {
    repeated CreateOrderItem Items = 1;
}

message DeleteOrderRequest {
    int32 id = 1;
}

message ChangeOrderStatusRequest {
    int32 id = 1;
    string status = 2;
}

// Responses
message ListOrdersResponse {
    repeated Order orders = 1;
}

message GetOrderResponse {
    Order order = 1;
}

message CreateOrderResponse {
    Order order = 1;
}

// Entities
message OrderItem {
    int32 order_id = 1;
    int32 product_id = 2;
    int32 quantity = 3;
    int32 price_at_purchase = 4;
}

message CreateOrderItem {
    int32 product_id = 1;
    int32 quantity = 2;
    int32 price_at_purchase = 3;
}

message Order {
    int32 id = 1;
    string status = 2;
    int32 total_amount = 3;
    repeated OrderItem items = 4;
}